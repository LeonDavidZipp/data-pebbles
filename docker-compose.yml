services:
  backend:
    container_name: dp-backend
    build: backend
    environment:
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-dp_minio_user}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-supersecret}"
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://${POSTGRES_USER:-dp_pg_user}:${POSTGRES_PASSWORD:-supersecret}@postgres/${POSTGRES_DB:-dp_db}"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://mlflow/}"
      MLFLOW_ARTIFACTS_DESTINATION: "${MLFLOW_ARTIFACTS_DESTINATION:-s3://mlflow/}"
    ports:
      - "8000:8000"
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  mlflow:
    container_name: dp-mlflow
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: "${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}"
      MLFLOW_S3_IGNORE_TLS: "${MLFLOW_S3_IGNORE_TLS:-true}"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-dp_minio_user}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-supersecret}"
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://${POSTGRES_USER:-dp_pg_user}:${POSTGRES_PASSWORD:-supersecret}@postgres/${POSTGRES_DB:-dp_db}"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://mlflow/}"
      MLFLOW_ARTIFACTS_DESTINATION: "${MLFLOW_ARTIFACTS_DESTINATION:-s3://mlflow/}"
    entrypoint: mlflow server -h 0.0.0.0
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    container_name: dp-db
    image: pgvector/pgvector@sha256:058fdb396f7b11f66cb7084db6c970846f8cb3a36b101b2714bea6727d530322
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dp_pg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      POSTGRES_DB: ${POSTGRES_DB:-dp_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dp_pg_user} -d ${POSTGRES_DB:-dp_db} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    container_name: dp-minio
    image: minio/minio@sha256:13582eff79c6605a2d315bdd0e70164142ea7e98fc8411e9e10d089502a6d883
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-8900}:8900"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-dp_minio_user}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-supersecret}"
    volumes:
      - "minio:/data/minio"
    command: 'minio server /data/minio --console-address ":8900"'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    container_name: dp-createbuckets
    image: minio/mc@sha256:95b5f3f7969a5c5a9f3a700ba72d5c84172819e13385aaf916e237cf111ab868
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-dp_minio_user}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-supersecret}"
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminio/mlflow --ignore-existing;
      mc anonymous set download myminio/mlflow;
      mc mb myminio/bronze --ignore-existing;
      mc anonymous set download myminio/bronze;
      exit 0;
      "

volumes:
  pgdata:
  minio:
    driver: local
